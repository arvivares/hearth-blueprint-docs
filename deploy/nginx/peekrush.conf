map $http_upgrade $peekrush_backend {
    default   peekrush-web:3000;
    websocket peekrush-game:2567;
}

server {
    listen 80;
    listen [::]:80;
    server_name peekrush.inmerzion.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://peekrush.inmerzion.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name peekrush.inmerzion.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/peekrush.inmerzion.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peekrush.inmerzion.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PeekrushSSL:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/peekrush.inmerzion.access.log inmerzion_session;
    error_log /var/log/nginx/peekrush.inmerzion.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $game_upstream http://peekrush-game:2567;
        proxy_pass $game_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /matchmake/ {
        set $game_upstream http://peekrush-game:2567;
        proxy_pass $game_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $game_upstream http://peekrush-game:2567;
        proxy_pass $game_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/event {
        proxy_pass http://plausible:8000/api/event;
        proxy_set_header Host plausible.inmerzion.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream http://$peekrush_backend;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Plausible Analytics
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter "</head>" "<!-- Privacy-friendly analytics by Plausible --><script async src=\"https://plausible.inmerzion.io/js/pa-Mp_6cl3ZhtstLD9Z6jFYf.js\"></script><script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script></head>";
    }

    location ~ /\. {
        deny all;
    }
}
