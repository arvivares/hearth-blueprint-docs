# Despliegue independiente de Lovable: PostgreSQL + servidor de juego.
# Uso: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: logos
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U logos"], interval: 5s, retries: 10 }
  game:
    build: { context: .., dockerfile: apps/game-server/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://logos:${POSTGRES_PASSWORD}@db:5432/logos
      TOKEN_SECRET: ${TOKEN_SECRET:?define TOKEN_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?define ALLOWED_ORIGINS}
      NODE_ENV: production
    ports: ["2567:2567"]
volumes:
  pgdata:
